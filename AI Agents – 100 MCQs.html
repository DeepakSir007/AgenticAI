// seeded shuffle so option order is stable
let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
const L=document.getElementById('L');
D.forEach((d,i)=>{
  const opts=d.slice(1).map((t,k)=>({t,c:k===0}));
  for(let k=3;k>0;k--){const j=Math.floor(r()*(k+1));[opts[k],opts[j]]=[opts[j],opts[k]];}
  const ci=opts.findIndex(o=>o.c),ab='ABCD';
  const q=document.createElement('div');q.className='q';
  const h=document.createElement('h3');h.textContent=(i+1)+'. '+d[0];q.appendChild(h);

  const a=document.createElement('div');a.className='a';a.textContent='Answer: '+ab[ci]+') '+opts[ci].t;q.appendChild(a);
  const b=document.createElement('button');b.textContent='Show Answer';
  b.onclick=()=>{q.classList.toggle('show');b.textContent=q.classList.contains('show')?'Hide Answer':'Show Answer';};

let all=false;
document.getElementById('all').onclick=function(){
  all=!all;this.textContent=all?'Hide all answers':'Show all answers';
  document.querySelectorAll('.q').forEach(q=>{q.classList.toggle('show',all);q.querySelector('button').textContent=all?'Hide Answer':'Show Answer';});
};
